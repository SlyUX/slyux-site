<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sly UX</title>
    <meta name="description" content="Sly UX — Clever and Capable User Experience" />
    <style>
      :root {
        --bg: #0e0e10;
        --fg: #ffffff;
        --muted: #a1a1aa;
        --accent: #ff0095;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 34rem; }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 12vw, 5rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      h1 .dot { color: var(--accent); }
      p.tagline {
        margin: 0.75rem 0 2rem;
        color: var(--muted);
        font-size: 1.05rem;
        letter-spacing: 0.02em;
      }
      a.contact {
        color: var(--fg);
        text-decoration: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 2px;
        font-weight: 600;
      }
      a.contact:hover { color: var(--accent); }
      @media (prefers-color-scheme: light) {
        :root { --bg: #ffffff; --fg: #0e0e10; --muted: #52525b; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sly UX<span class="dot">.</span></h1>
      <p class="tagline">Clever and Capable User Experience</p>
      <a class="contact" href="mailto:fox@slyux.com">fox@slyux.com</a>
    </main>
  </body>
</html>
